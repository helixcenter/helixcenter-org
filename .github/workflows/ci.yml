name: Deploy

on:
  push:
    branches: [ '**' ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      # Run tests
      - run: npm test

